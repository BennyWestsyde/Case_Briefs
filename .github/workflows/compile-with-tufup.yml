name: Build and Package CaseBriefs App with Tufup Support

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - main
          - beta
          - alpha
        default: main
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x86_64
            platform: macos-x86_64
          - os: macos-14
            arch: arm64
            platform: macos-arm64
          - os: windows-latest
            arch: x86_64
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Update version in code
        shell: bash
        run: |
          # Update version.py with the release version
          cat > version.py << EOF
          """Version information for CaseBriefs application."""
          
          # This version is automatically updated by the build process
          __version__ = "${{ inputs.version }}"
          __version_info__ = tuple(map(int, "${{ inputs.version }}".split(".")))
          EOF
          echo "Updated version.py with version ${{ inputs.version }}"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller CaseBriefs.spec
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -d dist/CaseBriefs.app
            echo "macOS app bundle created successfully"
          else
            test -f "dist/CaseBriefs/CaseBriefs.exe"
            echo "Windows executable created successfully"
          fi

      - name: Set up Tufup repository (basic)
        shell: bash
        run: |
          # Create basic tufup structure for development
          # Full tufup implementation would require proper key management
          python setup_tufup.py \
            --version "${{ inputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --dist-dir dist \
            --repo-dir tufup-repo \
            --setup-only
          echo "Basic tufup structure created"

      - name: Package application
        shell: bash
        run: |
          cd dist
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Package macOS app
            ditto -c -k --sequesterRsrc --keepParent "CaseBriefs.app" \
              "CaseBriefs-${{ matrix.platform }}.zip"
          else
            # Package Windows app
            cd CaseBriefs
            7z a -tzip "../CaseBriefs-${{ matrix.platform }}.zip" .
            cd ..
          fi
          echo "Application packaged successfully"

      - name: Create channel-specific package name
        shell: bash
        run: |
          cd dist
          CHANNEL="${{ inputs.channel }}"
          PLATFORM="${{ matrix.platform }}"
          
          if [ "$CHANNEL" != "main" ]; then
            # For non-main channels, include channel in filename
            mv "CaseBriefs-${PLATFORM}.zip" "CaseBriefs-${CHANNEL}-${PLATFORM}.zip"
            echo "Renamed package for channel: $CHANNEL"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaseBriefs-${{ inputs.channel }}-${{ matrix.platform }}
          path: |
            dist/CaseBriefs*.zip
            tufup-repo/metadata/**
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create or update release tag
        run: |
          TAG='${{ inputs.version }}'
          CHANNEL='${{ inputs.channel }}'
          
          # For non-main channels, append channel to tag
          if [ "$CHANNEL" != "main" ]; then
            TAG="${TAG}-${CHANNEL}"
          fi
          
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} exists, will update release"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Created new tag: ${TAG}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Copy all built packages to release assets
          find artifacts -name "CaseBriefs*.zip" -exec cp {} release-assets/ \;
          
          # List what we have
          echo "Release assets:"
          ls -la release-assets/

      - name: Create or update GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: CaseBriefs ${{ env.RELEASE_TAG }}
          body: |
            # CaseBriefs Release ${{ env.RELEASE_TAG }}
            
            **Channel:** ${{ inputs.channel }}
            **Version:** ${{ inputs.version }}
            
            ## Features
            - ✅ Cross-platform support (macOS, Windows)
            - ✅ Automatic update checking
            - ✅ Multiple release channels (main, beta, alpha)
            - ✅ Secure updates via Tufup framework
            
            ## Downloads
            Choose the appropriate download for your platform:
            
            ### macOS
            - **Intel Macs (x86_64):** CaseBriefs-*-macos-x86_64.zip
            - **Apple Silicon (M1/M2/M3):** CaseBriefs-*-macos-arm64.zip
            
            ### Windows
            - **Windows 64-bit:** CaseBriefs-*-windows-x86_64.zip
            
            ## Installation
            1. Download the appropriate file for your platform
            2. Extract the archive
            3. Run the CaseBriefs application
            
            ## Update Channel
            This release is published to the **${{ inputs.channel }}** channel. You can switch channels in the application settings.
          draft: false
          prerelease: ${{ inputs.prerelease }}

      - name: Upload macOS x86_64
        if: always()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-assets/CaseBriefs-${{ inputs.channel }}-macos-x86_64.zip
          asset_name: CaseBriefs-${{ inputs.channel }}-macos-x86_64.zip
          asset_content_type: application/zip
        continue-on-error: true

      - name: Upload macOS arm64
        if: always()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-assets/CaseBriefs-${{ inputs.channel }}-macos-arm64.zip
          asset_name: CaseBriefs-${{ inputs.channel }}-macos-arm64.zip
          asset_content_type: application/zip
        continue-on-error: true

      - name: Upload Windows x86_64
        if: always()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-assets/CaseBriefs-${{ inputs.channel }}-windows-x86_64.zip
          asset_name: CaseBriefs-${{ inputs.channel }}-windows-x86_64.zip
          asset_content_type: application/zip
        continue-on-error: true